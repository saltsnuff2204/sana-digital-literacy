name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and check types
        run: |
          npm ci
          npm run typecheck
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Build device app without Apple credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -version
          xcodebuild \
            -workspace ios/Sana.xcworkspace \
            -scheme Sana \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcodebuild.log
      - name: Package unsigned IPA and verify embedded content
        run: python3 scripts/package-ios.py build/DerivedData/Build/Products/Release-iphoneos/Sana.app build/Sana-unsigned.ipa
      - name: Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sana-iOS-unsigned
          path: |
            build/Sana-unsigned.ipa
            build/Sana-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 1
